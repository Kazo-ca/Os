name: Deploy Kazo OS beta site

# ADR 0271 §3: every push of the permanent beta branch publishes the WASM OS to its own origin,
# https://os-beta.kazo.ca, hosted by Cloudflare Pages. A separate origin keeps the beta away from
# the stable site's IndexedDB database, caches and service worker. The build is the one of
# "Deploy to GitHub Pages" (deploy-to-pages.yml) without legacy/, plus the beta branding
# (build/tools/brand-beta-site.sh: PWA and tab named "Kazo OS Beta"). os.kazo.ca/beta redirects
# here (build/pages/beta-redirect.html, copied by assemble-pages.ps1).
#
# Needs, in the Os repository: the secrets CLOUDFLARE_API_TOKEN (permission "Cloudflare Pages:
# Edit") and CLOUDFLARE_ACCOUNT_ID, and optionally the variable BETA_SITE_PROJECT (the Cloudflare
# Pages project, kazo-os-beta by default). doc/en/wasm/dev/beta-site.md has the setup steps.
#
# A pull request that changes this workflow or its scripts builds the site and checks it without
# deploying anything.
on:
  push:
    branches: [ "beta" ]
    paths:
      - 'wasm2/KazoOs/**'
      - '.github/workflows/deploy-beta-site.yml'
  pull_request:
    paths:
      - '.github/workflows/deploy-beta-site.yml'
      - 'wasm2/KazoOs/build/tools/brand-beta-site.sh'
      - 'wasm2/KazoOs/build/tools/check-static-site-limits.sh'
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push of beta replaces a deployment still building.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('beta-site-pr-{0}', github.ref) || 'beta-site' }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  SITE_DIR: wasm2/KazoOs/artifacts/beta-publish/wwwroot

jobs:
  deploy:
    # A manual run deploys only from beta: any other branch would put a non-beta OS on the beta site.
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/beta'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # ADR 0236: the build number counts the commits, so the whole history is needed.
          fetch-depth: 0

      # ADR 0271 §1: beta always carries X.Y.Z-preview.<n>. The OS reads its channel (the « Beta »
      # badge, the link back to the stable site) from that version.
      - name: Check the release channel
        shell: bash
        run: wasm2/KazoOs/build/tools/check-release-channel.sh "${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}"

      - name: Setup .NET 10
        uses: ./.github/actions/setup-dotnet-sdk

      - name: Install WASM workload
        working-directory: wasm2/KazoOs
        run: dotnet workload install wasm-tools

      - name: Compute the build number
        shell: bash
        run: echo "KazoOsBuildNumber=$(wasm2/KazoOs/build/build-number.sh)" >> "$GITHUB_ENV"

      # Before the publish: the service worker's asset manifest must hash the renamed files.
      - name: Name the PWA "Kazo OS Beta"
        shell: bash
        run: wasm2/KazoOs/build/tools/brand-beta-site.sh

      - name: Publish standalone WASM
        working-directory: wasm2/KazoOs
        run: >-
          dotnet publish OS/Kazo.Os.Ecosystem/Kazo.Os.Ecosystem.csproj
          --configuration Release --output artifacts/beta-publish -m:1

      # Cloudflare Pages: at most 20,000 files and 25 MiB per file.
      - name: Check the Cloudflare Pages limits
        shell: bash
        run: wasm2/KazoOs/build/tools/check-static-site-limits.sh "$SITE_DIR"

      - name: Check the Cloudflare settings
        if: github.event_name != 'pull_request'
        id: cloudflare
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.BETA_SITE_PROJECT || 'kazo-os-beta' }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error title=Beta site::The secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are missing (doc/en/wasm/dev/beta-site.md)."
            exit 1
          fi
          # Deploying to the project's production branch updates os-beta.kazo.ca itself (any other
          # branch name would only create a preview address). Read it instead of guessing it.
          answer="$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT")"
          branch="$(jq -r 'if .success then .result.production_branch // "" else "" end' <<<"$answer" 2>/dev/null || true)"
          if [[ -z "$branch" ]]; then
            echo "::error title=Beta site::Cloudflare Pages project '$PROJECT' not readable: $(jq -c '.errors' <<<"$answer" 2>/dev/null || echo 'no answer')."
            exit 1
          fi
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy ${{ env.SITE_DIR }}
            --project-name=${{ steps.cloudflare.outputs.project }}
            --branch=${{ steps.cloudflare.outputs.branch }}
            --commit-hash=${{ github.sha }}
            --commit-dirty=true
