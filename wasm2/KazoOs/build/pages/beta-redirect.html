<!DOCTYPE html>
<!--
    ADR 0271 §3: os.kazo.ca/beta is not the beta itself. The beta lives on its own origin,
    os-beta.kazo.ca, so it never opens the stable site's database or caches. assemble-pages.ps1
    copies this page to beta/index.html; the service worker leaves beta/ to the network.
    The query string and the fragment are kept (?autolaunch=<app id> still works).
-->
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Kazo OS Beta</title>
    <link rel="canonical" href="https://os-beta.kazo.ca/" />
    <meta http-equiv="refresh" content="0; url=https://os-beta.kazo.ca/" />
    <script>
        location.replace('https://os-beta.kazo.ca/' + location.search + location.hash);
    </script>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0d1117; color: #e5f4f0; font-family: system-ui, sans-serif; }
        a { color: #c792ea; }
    </style>
</head>
<body>
    <p lang="fr">La bêta de Kazo OS est sur <a href="https://os-beta.kazo.ca/">os-beta.kazo.ca</a>.</p>
    <p lang="en">The Kazo OS beta is at <a href="https://os-beta.kazo.ca/">os-beta.kazo.ca</a>.</p>
</body>
</html>
